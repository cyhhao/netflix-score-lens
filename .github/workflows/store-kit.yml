name: Store preparation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-reviewed-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Strict release-preparation validation belongs here, not in ordinary CI:
      # a provider bugfix must not require a new screenshot/metadata review.
      - run: python3 scripts/store-kit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-preparation-not-approved
          path: dist/*-store-preparation.zip
          if-no-files-found: error
          retention-days: 14
